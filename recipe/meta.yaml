{% set name = "types-python-dateutil" %}
{% set version = "2.9.0.20260807" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/types_python_dateutil-{{ version }}.tar.gz
  sha256: e0b8a90d464c8684c66b7b8e4556d9074afdddcc56ca45323f0987134f9e7034

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=82.0.1
  run:
    - python

test:
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/python/typeshed
  summary: Typing stubs for python-dateutil
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://github.com/python/typeshed/blob/main/README.md
  dev_url: https://github.com/python/typeshed/tree/main
  description: This is a PEP 561 type stub package for the python-dateutil package.

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
  skip-lints:
    # No tests inside
    - missing_imports_or_run_test_py
    - missing_tests
